name: DaemonBridge
description: Bindings to a local daemon.
output: "lib/retrovibed/gen.dart"
headers:
  entry-points:
    # darwin stages into its own subdirectory so a linux .so never reaches a macOS
    # build; see DarwinLibDir in .eg/console/console.darwin.go. missing entry-points
    # are skipped, which is already how the two relative depths above coexist.
    - "../../.eg.cache/dev.native.libs/darwin/libretrovibed.h"
    - "../.eg.cache/dev.native.libs/darwin/libretrovibed.h"
    - "../../.eg.cache/dev.native.libs/libretrovibed.h"
    - "../.eg.cache/dev.native.libs/libretrovibed.h"
compiler-opts:
  - "-I/usr/lib/clang/19/include"
  - "-I/usr/lib/clang/20/include"
  - "-I/usr/lib/clang/22/include"
  - "-I/usr/include"
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_field
  // ignore_for_file: unused_element
comments:
  style: any
  length: full

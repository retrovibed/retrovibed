[package]
edition = "2021"
rust-version = "1.74"
name = "liquid"
version = "0.26.8"
build = false
include = [
    "build.rs",
    "src/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE*",
    "README.md",
    "benches/**/*",
    "examples/**/*",
]
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The liquid templating language for Rust"
documentation = "https://docs.rs/liquid"
readme = "README.md"
keywords = [
    "liquid",
    "template",
    "templating",
    "language",
    "html",
]
categories = ["template-engine"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cobalt-org/liquid-rust"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
min = 1
replace = "{{version}}"
search = "Unreleased"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = "...{{tag_name}}"
search = '\.\.\.HEAD'

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
min = 1
replace = "{{date}}"
search = "ReleaseDate"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = """
<!-- next-header -->
## [Unreleased] - ReleaseDate
"""
search = "<!-- next-header -->"

[[package.metadata.release.pre-release-replacements]]
exactly = 1
file = "CHANGELOG.md"
replace = """
<!-- next-url -->
[Unreleased]: https://github.com/cobalt-org/liquid-rust/compare/{{tag_name}}...HEAD"""
search = "<!-- next-url -->"

[lib]
name = "liquid"
path = "src/lib.rs"

[[bench]]
name = "handlebars"
path = "benches/handlebars.rs"
harness = false

[[bench]]
name = "liquid"
path = "benches/liquid.rs"
harness = false

[[bench]]
name = "tera_bigcontext"
path = "benches/tera_bigcontext.rs"
harness = false

[[bench]]
name = "tera_template"
path = "benches/tera_template.rs"
harness = false

[[bench]]
name = "tera_tera"
path = "benches/tera_tera.rs"
harness = false

[dependencies.doc-comment]
version = "0.3"

[dependencies.liquid-core]
version = "^0.26.8"

[dependencies.liquid-derive]
version = "^0.26.7"

[dependencies.liquid-lib]
version = "^0.26.8"

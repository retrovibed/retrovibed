name: ios release
permissions:
  contents: write
  id-token: write
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  ios:
    name: ios-build
    runs-on: macos-latest
    steps:
      - name: Select Xcode 26+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Setup Go environment on macOS
        id: setup-go-macos
        uses: actions/setup-go@v5
        with:
          go-version: "stable" # Use 'stable' to always get the latest stable Go version
          cache: true # Enable caching for Go modules and build cache
          check-latest: true # Ensures the latest stable version is always used
      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: "duckdb gpgme flutter tree ffmpeg@7"
          verbose: false
      - name: Install EG
        uses: nick-fields/retry@v3
        with:
          max_attempts: 5 # Number of retries
          timeout_minutes: 20
          command: go install github.com/egdaemon/eg/...@latest
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get commit year-month
        id: commit-date
        run: echo "yearmonth=$(git log -1 --format=%cd --date=format:'%Y-%m')" >> "$GITHUB_OUTPUT"
      - name: Cache .eg.cache
        uses: actions/cache@v4
        with:
          path: .eg.cache
          key: eg-cache-${{ runner.os }}-${{ steps.commit-date.outputs.yearmonth }}
          restore-keys: |
            eg-cache-${{ runner.os }}-
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Debug Flutter SDK
        run: ls -lha $(dirname $(dirname $(which flutter)))
      - name: Fix Flutter SDK cache permissions
        run: sudo chown -R $(id -un) $(dirname $(dirname $(which flutter)))
      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios
      - name: build
        run: |
          eg compute baremetal --no-podman --secret=gcpsm://${{ secrets.GCP_PROJECT }}/apple-signing-env release/ios

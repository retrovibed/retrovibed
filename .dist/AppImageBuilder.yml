# Resolute has a number of third party bugs we've worked around:
#
# THIRD PARTY BUG: appimage-builder throws APPRUN_ERROR (ENOENT) on launch.
# appimage-builder installs the dynamic linker into runtime/compat/usr/lib64/ but
# fails to generate the root-level lib64 symlink the AppRun runtime expects to
# find it at. Fixed below via after_runtime, which creates the missing symlink
# once runtime/compat/ has been populated but before the AppDir is packaged.
#
# THIRD PARTY BUG: libass crashes with "undefined symbol: FcConfigSetDefaultSubstitute"
# on launch. libass is pulled in transitively via ffmpeg8/libavfilter, and needs a
# fontconfig new enough to export FcConfigSetDefaultSubstitute (fontconfig >= 2.17).
# appimage-builder excludes fontconfig from the bundle by default, leaving it to
# resolve against whatever fontconfig the host has, which is commonly older than
# that. We bundle libfontconfig1/fontconfig-config explicitly from the same apt
# snapshot libass comes from -- we don't want to rely on host libraries when we
# can avoid it.
#
# THIRD PARTY BUG: (worked around by replacement, not a runtime patch): GTK's
# icon-theme rendering routes SVG loading through glycin, which spawns a sandboxed
# helper at a hardcoded absolute path (e.g. /usr/libexec/glycin-loaders/2+/glycin-svg).
# AppImage's mount doesn't remap /usr the way Flatpak's sandbox does, so that lookup
# always hits the real host filesystem, which usually doesn't have glycin at that
# exact path -- and even a bwrap-relaunch grafting the bundle's own glycin-loaders in
# still crashes on hosts missing the loader binaries' own dependency closure (they
# have no RPATH). Rather than patch around that, apt.exclude the stock
# glycin/glycin-loaders/libglycin-2-0 packages and apt.include glycin-ng instead: a
# from-scratch, permissively-licensed reimplementation (github.com/QaidVoid/glycin-ng,
# packaged in .eg/debuild/glycinng) that decodes in-process (Landlock/seccomp on a
# worker thread) instead of spawning subprocess helpers, so this whole class of bug
# doesn't apply. It ships a same-ABI libglycin-2.so.0 shim, so nothing downstream
# (gdk-pixbuf/GTK) needs to change.
#
# THIRD PARTY BUG: media_kit (the Flutter video/audio player) segfaults inside
# libluajit-5.1.so.2, deep in mpv's bundled ytdl_hook.lua (thread "lua/ytdl_hook",
# SEGV_MAPERR via lua_cpcall) whenever it opens our own internal stream URL
# (https://localhost:.../m/<id>). apt.include only pulls libmpv2, which brings in
# a versioned libmpv.so.2 -- there's no unversioned libmpv.so in the bundle. Flutter's
# media_kit opens the library by the bare "libmpv.so" soname, which isn't present in
# $APPDIR_LIBRARY_PATH, so AppRun's search falls through to
# $APPRUN_ORIGINAL_LD_LIBRARY_PATH and silently loads the HOST's system libmpv.so
# instead -- which on distros like Arch is linked against libluajit-5.1, an
# incompatible/crashing combination with modern kernel ASLR (LuaJIT's NaN-tagged
# pointers assume <=47-bit addresses; mmap on newer kernels can return higher).
# The bundled libmpv2 (from Ubuntu apt) links plain liblua5.2 instead and doesn't
# hit this at all -- the fix is just making sure the bare soname resolves inside the
# bundle rather than leaking out to the host. Fixed via after_bundle, which adds the
# missing libmpv.so -> libmpv.so.2 symlink once apt has installed libmpv2 but before
# appimage-builder's own symlink/runtime setup runs.

version: 1

AppDir:
  path: !ENV "${APPDIR}"

  app_info:
    id: space.retrovibe.Console
    name: retrovibed
    icon: space.retrovibe.Console
    version: !ENV "${VERSION}"
    exec: usr/lib/retrovibed/retrovibed
    exec_args: $@

  after_runtime: |
    mkdir -p "${APPDIR}/runtime/compat/lib64"
    ln -sf ../usr/lib64/ld-linux-x86-64.so.2 "${APPDIR}/runtime/compat/lib64/ld-linux-x86-64.so.2"

  apt:
    arch: !ENV "${APT_ARCH}"
    sources:
      - sourceline: "deb https://archive.ubuntu.com/ubuntu/ resolute main restricted universe multiverse"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
      - sourceline: "deb https://archive.ubuntu.com/ubuntu/ resolute-updates main restricted universe multiverse"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
      - sourceline: "deb https://archive.ubuntu.com/ubuntu/ resolute-backports main restricted universe multiverse"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
      - sourceline: "deb http://security.ubuntu.com/ubuntu resolute-security main restricted universe multiverse"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
      - sourceline: "deb https://ppa.launchpadcontent.net/jljatone/retrovibed/ubuntu resolute main"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x872D11DA822A34E7E8499E6DA953F6DC11C77486"
    include:
      # direct
      - libmpv2
      - ffmpeg
      - duckdb
      # platform/transitive
      - libgtk-3-0t64
      - libglu1-mesa
      - librsvg2-common
      - libxcb-shape0
      - shared-mime-info
      - dash
      - bash
      - perl
      - libfontconfig1
      - fontconfig-config
      - humanity-icon-theme
      - hicolor-icon-theme
      - adwaita-icon-theme
      - ubuntu-mono
      - glycin-ng
    exclude:
      - libglib2.0-data
      - libglycin-2-0
      - glycin-loaders

  # media_kit libmpv.so symlink bug -- see note above.
  after_bundle: |
    ln -sf libmpv.so.2 "${APPDIR}/usr/lib/x86_64-linux-gnu/libmpv.so"

  files:
    exclude:
      - usr/share/man
      - usr/share/doc
      - usr/share/bash-completion

AppImage:
  comp: zstd
  arch: !ENV "${APPIMAGE_ARCH}"
  update-information: !ENV "gh-releases-zsync|retrovibed|retrovibed|latest|retrovibed-*-${APPIMAGE_ARCH}.AppImage.zsync"
  file_name: !ENV "${APPIMAGE_FILE_NAME}"

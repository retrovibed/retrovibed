<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    minimal fontconfig configuration, used by the AppImage (FONTCONFIG_FILE in .dist/AppImageBuilder.yml).
    not used by the debian, arch or flatpak builds, they use the system's fontconfig.

    this is the stock fonts.conf without its conf.d include. the bundled libfontconfig can be older than
    the host's and, when conf.d is included, also parses the host's /usr/share/fontconfig/conf.avail,
    which can use syntax it doesn't know and floods stderr with "Fontconfig warning: invalid constant".
    trade-off: none of the conf.d defaults apply (hinting/antialiasing, dejavu/vera aliases, generic
    family mapping). flutter ships its own fonts, gtk falls back to what it finds.
  -->

  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
  <dir prefix="relative">../../share/fonts</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>~/.fontconfig</cachedir>
</fontconfig>

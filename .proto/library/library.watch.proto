syntax = "proto3";

package library;

message WatchHistoryRecord {
  string id = 1 [ json_name = "id" ];
  string media_id = 2 [ json_name = "media_id" ];
  uint64 duration = 3 [ json_name = "duration" ];
}

message WatchHistoryRecordRequest {
  WatchHistoryRecord record = 1 [ json_name = "record" ];
}

message WatchHistoryRecordResponse {}

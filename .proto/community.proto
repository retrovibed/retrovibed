syntax = "proto3";

package retrovibed.community;

enum PublishMode {
  UNLISTED = 0;
  LISTED = 1;
  SYNDICATED = 2;
}

message Community {
  string id = 1 [ json_name = "id" ];
  string account_id = 2 [ json_name = "account_id" ];
  string created_at = 4 [ json_name = "created_at" ];
  string updated_at = 5 [ json_name = "updated_at" ];
  string mimetype = 6 [ json_name = "mimetype" ];
  string domain = 7 [ json_name = "domain" ];
  string description = 8 [ json_name = "description" ];
  string entropy = 9 [ json_name = "entropy" ];
  uint64 bytes = 10 [ json_name = "bytes" ];
  string subscribed_at = 11 [ json_name = "subscribed_at" ];
  PublishMode default_publish_mode = 12 [ json_name = "default_publish_mode" ];
  bool hidden = 13 [ json_name = "hidden" ];
  string url = 14 [ json_name = "url" ];
  bool adult = 15 [ json_name = "adult" ];
  uint64 default_ttl = 16 [ json_name = "default_ttl" ];
  string default_language = 17 [ json_name = "default_language" ];
  reserved 18 to 999;
}

message CommunitySearchRequest {
  string query = 1 [ json_name = "query" ];
  uint64 offset = 2 [ json_name = "offset" ];
  uint64 limit = 3 [ json_name = "limit" ];
  reserved 4 to 999;
}

message CommunitySearchResponse {
  CommunitySearchRequest next = 1 [ json_name = "next" ];
  repeated Community items = 2 [ json_name = "items" ];
}

message CommunityCreateRequest {
  Community community = 1 [ json_name = "community" ];
}
message CommunityCreateResponse {
  Community community = 1 [ json_name = "community" ];
}

message CommunityFindRequest {}
message CommunityFindResponse {
  Community community = 1 [ json_name = "community" ];
}

message CommunityUploadRequest {
  Community community = 1 [ json_name = "community" ];
}
message CommunityUploadResponse {
  Community community = 1 [ json_name = "community" ];
}

message CommunityDeleteRequest {}
message CommunityDeleteResponse {
  Community community = 1 [ json_name = "community" ];
}

message CommunityUpdateRequest {
  Community community = 1 [ json_name = "community" ];
}
message CommunityUpdateResponse {
  Community community = 1 [ json_name = "community" ];
}

message PublishedContent {
  string id = 1 [ json_name = "id" ];
  string community_id = 2 [ json_name = "community_id" ];
  string known_media_id = 3 [ json_name = "known_media_id" ];
  string magnet_uri = 4 [ json_name = "magnet_uri" ];
  string published_at = 5 [ json_name = "published_at" ];
  string created_at = 6 [ json_name = "created_at" ];
  string updated_at = 7 [ json_name = "updated_at" ];
  string archived_id = 8 [ json_name = "archived_id" ];
  string title = 9 [ json_name = "title" ];
  string description = 10 [ json_name = "description" ];
  string mimetype = 11 [ json_name = "mimetype" ];
  string encryption_seed = 12 [ json_name = "encryption_seed" ];
  uint64 bytes = 13 [ json_name = "bytes" ];

  reserved 14 to 999;
  // private fields for retrovibed use only, not populated by clients.
  string library_id = 1000 [ json_name = "library_id" ];
  string oauth_google_id = 1001 [ json_name = "oauth_google_id" ];
}

message PublishContentRequest {
  PublishedContent published_content = 1 [ json_name = "published_content" ];
  PublishMode publish_mode = 2 [ json_name = "publish_mode" ];
  reserved 3;
}
message PublishContentResponse {
  PublishedContent published_content = 1 [ json_name = "published_content" ];
}

message PublishContentDeleteRequest {
  PublishedContent published_content = 1 [ json_name = "published_content" ];
}

message PublishContentDeleteResponse {
  PublishedContent published_content = 1 [ json_name = "published_content" ];
}

message PublishedContentListRequest {
  string community_id = 1 [ json_name = "community_id" ];
  reserved 2 to 899;
  uint64 offset = 900 [ json_name = "offset" ];
  uint64 limit = 901 [ json_name = "limit" ];
  reserved 902 to 999;
}
message PublishedContentListResponse {
  Community community = 1 [ json_name = "community" ];
  PublishedContentListRequest next = 2 [ json_name = "next" ];
  repeated PublishedContent items = 3 [ json_name = "items" ];
}

message CommunityMetric {
  string id = 1 [ json_name = "id" ];
  string community_id = 2 [ json_name = "community_id" ];
  string period_start = 3 [ json_name = "period_start" ];
  string period_end = 4 [ json_name = "period_end" ];
  uint32 subscribers = 5 [ json_name = "subscribers" ];
}

message PublishedContentMetric {
  string id = 1 [ json_name = "id" ];
  string published_content_id = 2 [ json_name = "published_content_id" ];
  string period_start = 3 [ json_name = "period_start" ];
  string period_end = 4 [ json_name = "period_end" ];
  uint32 archivers = 5 [ json_name = "archivers" ];
  int64 bytes = 6 [ json_name = "bytes" ];
  int64 revenue = 7 [ json_name = "revenue" ];
}

message CommunityMetricsRequest {
  string community_id = 1 [ json_name = "community_id" ];
  string period = 2 [ json_name = "period" ];
  string start_date = 3 [ json_name = "start_date" ];
  string end_date = 4 [ json_name = "end_date" ];
}

message CommunityMetricsResponse {
  CommunityMetric summary = 1 [ json_name = "summary" ];
  int32 total_archivers = 2 [ json_name = "total_archivers" ];
  repeated PublishedContentMetric items = 3 [ json_name = "items" ];
}

message MetricsSyncRequest {
  string community_id = 1 [ json_name = "community_id" ];
  string since = 2 [ json_name = "since" ];
}

message MetricsSyncResponse {
  repeated CommunityMetric community_metrics = 1
      [ json_name = "community_metrics" ];
  repeated PublishedContentMetric content_metrics = 2
      [ json_name = "content_metrics" ];
  string synced_at = 3 [ json_name = "synced_at" ];
  bool complete = 4 [ json_name = "complete" ];
}

message MetricsSyncProgress {
  string status = 1 [ json_name = "status" ];
  int32 community_metrics_count = 2 [ json_name = "community_metrics_count" ];
  int32 content_metrics_count = 3 [ json_name = "content_metrics_count" ];
  string error = 4 [ json_name = "error" ];
}

message CommunitySubscribeRequest {}
message CommunitySubscribeResponse {}

message YouTubeStatus {
  bool linked = 1 [ json_name = "linked" ];
  string id = 2 [ json_name = "id" ];
}

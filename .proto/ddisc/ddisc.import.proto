syntax = "proto3";

package ddisc;

message Import {
  string uri = 1 [ json_name = "uri" ];
  uint32 health = 2 [ json_name = "health" ];
  string mimetype = 3 [ json_name = "mimetype" ];
  string uritype = 4 [ json_name = "uritype" ];
  string known_media_id = 5 [ json_name = "known_media_id" ];
  string title = 6 [ json_name = "title" ];
  string overview = 7 [ json_name = "overview" ];
  double popularity = 8 [ json_name = "popularity" ];
  string poster_path = 9 [ json_name = "poster_path" ];
  string source = 10 [ json_name = "source" ];
  uint64 bytes = 11 [ json_name = "bytes" ];

  // Nested (rather than top-level like ddisc.AcquisitionState) so its
  // Unknown zero value is scoped to ddisc.Import, not the ddisc package -
  // proto3 scopes enum value names to their enclosing scope, and a
  // top-level LicenseStatus.Unknown here would collide with
  // ddisc.AcquisitionState's own top-level Unknown (ddisc.discovery.proto).
  enum LicenseStatus {
    Unknown = 0;
    Unlicensed = 1;
    Licensed = 2;
  }
  LicenseStatus licensed = 12 [ json_name = "licensed" ];
}

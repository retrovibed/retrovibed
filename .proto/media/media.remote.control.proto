syntax = "proto3";

package media;

import "media/media.proto";
import "meta/meta.daemon.proto";

// enqueue a bit of media for playback.
message Queue { Media media = 1 [ json_name = "media" ]; }
// dequeue the media with the given id.
message Dequeue { string id = 1 [ json_name = "id" ]; }
// playpause commands the device to toggle media playback.
// the paused flag is to
message PlayPause { bool paused = 1 [ json_name = "paused" ]; }

// Seek - move forward/back the given amount of time (milliseconds), relative
// to the current position. offset == int32 max/min is a sentinel meaning
// "skip to next/previous track" rather than a literal seek.
message Seek { int32 offset = 1 [ json_name = "offset" ]; }

// Volume sets (sent by a connect client) or reports (echoed by the listener
// whenever its local volume changes, independent of Sync) the audio volume,
// 0-100 scale.
message Volume { float level = 1 [ json_name = "level" ]; }

// Sync requests (when sent with no fields set) or reports (when sent
// populated) the listener's current library and playback queue. A connect
// client sends an empty Sync to ask the listener to reply with its state;
// the listener responds on the same tag with library + queue populated.
message Sync {
  meta.Daemon library = 1 [ json_name = "library" ];
  uint32 capacity = 2 [ json_name = "capacity" ];
  Media current = 3 [ json_name = "current" ];
  string token = 4 [ json_name = "token" ];
  int64 expiration = 5 [ json_name = "expiration" ];
  float volume = 6 [ json_name = "volume" ];
  reserved 7 to 999;
  repeated Media queue = 1000 [ json_name = "queue" ];
}

// represents a stream of commands / responses for the remote control.
// each command / response will contain a 'sid' representing the sequentialish
// id.
message Stream {
  string sid = 1 [ json_name = "sid" ];
  oneof Command {
    Queue queue = 1000 [ json_name = "queue" ];
    Dequeue dequeue = 1002 [ json_name = "dequeue" ];
    PlayPause playpause = 1003 [ json_name = "playpause" ];
    Seek seek = 1004 [ json_name = "seek" ];
    Sync sync = 1005 [ json_name = "sync" ];
    Volume volume = 1006 [ json_name = "volume" ];
  }
}

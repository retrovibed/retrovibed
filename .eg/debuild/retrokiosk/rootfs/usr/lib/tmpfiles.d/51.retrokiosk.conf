# `man 5 tmpfiles.d` for documentation.
C /home/retrokiosk 0750 retrokiosk retrokiosk - /usr/share/retrokiosk/skel
d /usr/lib/retrokiosk 0750 retrokiosk retrokiosk -

# also bootstrap the pipewire airplay config directly for machines where
# /home/retrokiosk already existed before this file was introduced (the
# C line above only fires when /home/retrokiosk itself is missing)
d /home/retrokiosk/.config                              0750 retrokiosk retrokiosk -
d /home/retrokiosk/.config/pipewire                      0750 retrokiosk retrokiosk -
d /home/retrokiosk/.config/pipewire/pipewire.conf.d      0750 retrokiosk retrokiosk -
C /home/retrokiosk/.config/pipewire/pipewire.conf.d/retro.airplay.conf 0644 retrokiosk retrokiosk - /usr/share/retrokiosk/skel/.config/pipewire/pipewire.conf.d/retro.airplay.conf

# enable lingering so retrokiosk's user services run without an active login session
f /var/lib/systemd/linger/retrokiosk 0644 root root -
